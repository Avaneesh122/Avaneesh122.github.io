name: Update Clash Royale stats

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clash-royale-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for CR_API_TOKEN secret
        id: check
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        run: |
          if [ -z "$CR_API_TOKEN" ]; then
            echo "CR_API_TOKEN secret is not set yet — skipping this run. See README for setup." >&2
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_token == 'true'
        with:
          node-version: 22

      - name: Fetch stats
        if: steps.check.outputs.has_token == 'true'
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        run: node scripts/fetch-clash-royale.mjs

      - name: Commit if changed
        if: steps.check.outputs.has_token == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/clash-royale.json; then
            git add public/clash-royale.json
            git commit -m "Update Clash Royale stats"
            git push
          else
            echo "No change in stats, skipping commit."
          fi
